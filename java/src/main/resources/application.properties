# **************************************************************
# Best Buds
# Application configuration
# **************************************************************

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT
jwt.base64-secret=${JWT_BASE64_SECRET}
jwt.token-validity-in-seconds=${JWT_TOKEN_VALIDITY:86400}
jwt.token-validity-in-seconds-for-remember-me=${JWT_REMEMBER_ME_VALIDITY:108000}

# APIs
yelp.api.url=${YELP_API_URL:https://api.yelp.com/v3}
yelp.api.key=${YELP_API_KEY}

news.api.url=${NEWS_API_URL:https://api.thenewsapi.com/v1}
news.api.key=${NEWS_API_KEY}

# Server
spring.web.error.include-stacktrace=never
server.port=${SERVER_PORT:9000}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Email
app.email.from=${EMAIL_FROM:Best Buds <bestbudslocator@gmail.com>}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Profile image uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB